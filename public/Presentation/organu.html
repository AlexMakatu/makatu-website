<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Organogram</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .box {
            padding: 15px;
            border-radius: 10px;
            background-color: #311d60;
            color: white;
            margin: 10px;
            width: 250px;
            text-align: center;
            font-weight: bold;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }
        .line {
            width: 2px;
            height: 20px;
            background-color: black;
            margin: 0 auto;
        }
        .level {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <h2>Company Organogram</h2>
    <div class="container">
        <div class="box">Rudzani - CEO & William - Partner</div>
        <div class="line"></div>
        <div class="level">
            <div class="box">Lungile Mnguni - General Manager</div>
            <div class="box">Alex Heuer - Business Analyst</div>
        </div>
        <div class="line"></div>
        <div class="box">Kyle Melis - Nissan Ops Manager</div>
        <div class="line"></div>
        <div class="level">
            <div class="box">Driver 1</div>
            <div class="box">Driver 2</div>
            <div class="box">Driver 3</div>
            <div class="box">Checker</div>
        </div>
    </div>
</body>
</html>
